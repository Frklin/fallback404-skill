name: Idea
description: A state, framework, house-style character or check you would like the skill to cover.
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like
      description: The page or state, the stack it lives in, and what it looks like today.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What goes wrong for your users without it.
